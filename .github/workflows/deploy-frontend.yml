# A munkafolyamat neve, ez fog megjelenni a GitHub Actions fülön.
name: Deploy Frontend

# Mikor fusson le a munkafolyamat
on:
  workflow_call: {}   # Ez kell az orchestrator importhoz
  workflow_dispatch:  # Lehetővé teszi a manuális futtatást is a GitHub Actions fülről

# A futtatandó feladatok (job-ok)
jobs:
  # A build és deploy feladat neve.
  build-and-deploy:
    # A környezet, amiben futni fog (leggyakrabban Ubuntu a CI/CD-hez)
    environment:
      name: production
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ezt kell a gh-pages-nek a push-hoz
      pages: write    # Ezt kell a GitHub Pages deploy-hoz
      id-token: write
    # A feladat lépései
    steps:
      # 1. Kód lekérése a repository-ból (Checkout)
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # 2. Node.js környezet beállítása
      # Fontos, hogy ugyanazt a Node.js verziót használja, mint amit helyben
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Használja a stabil, LTS verziót

      # 3. Függőségek telepítése
      # Ez futtatja az "npm install"-t
      - name: Install Dependencies
        run: npm install
        working-directory: ./frontend 

      # 4. Git felhasználói adatok konfigurálása
      - name: Configure Git User Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        working-directory: ./frontend 
        
      # 5. Érzékeny env változók validálása még build előtt
      - name: Validate Required Environment Variables
        env:
          REACT_APP_ADMIN_PASSWORD: ${{ vars.REACT_APP_ADMIN_PASSWORD }}
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: |
          if [ -z "$REACT_APP_ADMIN_PASSWORD" ]; then
            echo "Hiányzik az REACT_APP_ADMIN_PASSWORD environment value (vars)." >&2
            exit 1
          fi
          if [ -z "$REACT_APP_BACKEND_URL" ]; then
            echo "Hiányzik az REACT_APP_BACKEND_URL environment value (vars)." >&2
            exit 1
          fi
        working-directory: ./frontend 

      # 6. A build és deploy parancs futtatása
      - name: Run Deploy Script
        env:
          REACT_APP_ADMIN_PASSWORD: ${{ vars.REACT_APP_ADMIN_PASSWORD }}
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx gh-pages -d build --repo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        working-directory: ./frontend 