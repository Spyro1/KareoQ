# A munkafolyamat neve, ez fog megjelenni a GitHub Actions fülön.
name: Deploy Frontend

# Mikor fusson le a munkafolyamat
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_call: {}    # Ez kell az orchestrator importhoz
  workflow_dispatch:   # Lehetővé teszi a manuális futtatást is a GitHub Actions fülről

# A futtatandó feladatok (job-ok)
jobs:
  # A build és deploy feladat neve.
  build-and-deploy:
    # A környezet, amiben futni fog (leggyakrabban Ubuntu a CI/CD-hez)
    environment:
      name: production
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ezt kell a gh-pages-nek a push-hoz
      pages: write    # Ezt kell a GitHub Pages deploy-hoz
      id-token: write
    # A feladat lépései
    steps:
      # 1. Érzékeny env változók validálása ELSŐKÉNT
      - name: Validate Required Environment Variables
        env:
          REACT_APP_ADMIN_PASSWORD: ${{ vars.REACT_APP_ADMIN_PASSWORD }}
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        shell: bash
        run: |
          if [[ -z "$REACT_APP_ADMIN_PASSWORD" ]]; then
            echo "REACT_APP_ADMIN_PASSWORD változó hiányzik" >&2
            exit 1
          fi
          if [[ -z "$REACT_APP_BACKEND_URL" ]]; then
            echo "REACT_APP_BACKEND_URL változó hiányzik" >&2
            exit 1
          fi
          echo "Environment változók validálva."

      # 2. Kód lekérése a repository-ból (Checkout)
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # 3. Node.js környezet beállítása
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Függőségek telepítése
      - name: Install Dependencies
        run: npm install
        working-directory: ./frontend 

      # 5. Git felhasználói adatok konfigurálása
      - name: Configure Git User Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        working-directory: ./frontend 

      # 6. A build és deploy parancs futtatása
      - name: Run Deploy Script
        env:
          REACT_APP_ADMIN_PASSWORD: ${{ vars.REACT_APP_ADMIN_PASSWORD }}
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npm run build
          npx gh-pages -d build --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        working-directory: ./frontend