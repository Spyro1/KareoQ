# A munkafolyamat neve, ez fog megjelenni a GitHub Actions fülön.
name: FastAPI Backend Deploy

on:
  push:
    # branches:
    #   - main # Vagy a fő ágad neve
    # paths:
    #   - 'backend/**' # Csak a backend mappában történt változásokra fusson le
    #   - '.github/workflows/deploy-backend.yml' # Vagy ha ez a workflow fájl változik
    tags:
      - '*' # Bármelyik tag, a részletes ellenőrzést a workflow végzi
  workflow_dispatch:

jobs:
  deploy:
    # A környezet, amiben futni fog (leggyakrabban Ubuntu a CI/CD-hez)
    environment:
      name: production
    runs-on: ubuntu-latest

    steps:
      - name: Validate Release Tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::Ez a workflow csak tagek push-olásakor futtatható."
            exit 1
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ ! "${TAG_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\ -\ .+)?$ ]]; then
            echo "::error::A tag neve (${TAG_NAME}) nem illeszkedik a ^[0-9]+\\.[0-9]+\\.[0-9]+(\\ -\\ .+)?$ mintára."
            exit 1
          fi

          echo "Tag validálva: ${TAG_NAME}"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Használj egy megfelelő Python verziót

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        working-directory: ./backend
        run: |
          python tests_smoke.py

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL secret hiányzik"
            exit 1
          fi

          echo "Render deploy hook meghívása..."
          http_code=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          cat /tmp/render_response.txt

          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "Render hook sikeresen befogadva ($http_code)."
          else
            echo "Render hook hívás sikertelen (HTTP $http_code)."
            exit 1
          fi