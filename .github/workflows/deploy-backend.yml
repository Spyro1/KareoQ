        #     cd /path/to/your/app
        #     git pull origin main
        #     # Stb. a backend újraindításához szükséges parancsok

        # HELYETTE HASZNÁLJ EGY A SZOLGÁLTATÓD ÁLTAL JAVASOLT ACTION-T!
