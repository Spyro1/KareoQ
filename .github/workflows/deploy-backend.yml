# A munkafolyamat neve, ez fog megjelenni a GitHub Actions fülön.
name: FastAPI Backend Deploy

on:
  push:
    branches:
      - main # Vagy a fő ágad neve
    paths:
      - 'backend/**' # Csak a backend mappában történt változásokra fusson le
      - '.github/workflows/deploy-backend.yml' # Vagy ha ez a workflow fájl változik
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Használj egy megfelelő Python verziót

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        working-directory: ./backend
        run: |
          python tests_smoke.py

      # Itt jön a deploy a külső hostingra.
      # A konkrét lépések függnek attól, hova deployolsz (pl. Heroku, AWS, DigitalOcean, stb.)
      
      - name: Deploy to Hosting Service
        # PÉLDA: Ha SCP-vel (SSH) vagy egy adott CLI eszközzel (pl. Heroku CLI) deployolsz
