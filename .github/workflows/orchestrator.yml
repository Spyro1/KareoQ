name: Orchestrator

on:
  push:
    tags:
      - '*' # Bármelyik tag, a részletes ellenőrzést a workflow végzi
  workflow_dispatch:  # Lehetővé teszi a manuális futtatást is a GitHub Actions fülről

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release Tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::Ez a workflow csak tagek push-olásakor futtatható."
            exit 1
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ ! "${TAG_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\ -\ .+)?$ ]]; then
            echo "::error::A tag neve (${TAG_NAME}) nem illeszkedik a ^[0-9]+\\.[0-9]+\\.[0-9]+(\\ -\\ .+)?$ mintára."
            exit 1
          fi

          echo "Tag validálva: ${TAG_NAME}"

  deploy-frontend:
    needs: validate-tag
    uses: ./.github/workflows/deploy-frontend.yml

  deploy-backend:
    needs: deploy-frontend
    uses: ./.github/workflows/deploy-backend.yml
