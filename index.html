<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke dalkérés</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.25), transparent 55%),
                        radial-gradient(circle at 80% 10%, rgba(236, 72, 153, 0.2), transparent 60%),
                        radial-gradient(circle at 50% 85%, rgba(59, 130, 246, 0.18), transparent 60%);
            filter: blur(60px);
            opacity: 0.9;
            z-index: -2;
        }

        body::after {
            background: radial-gradient(circle at 15% 75%, rgba(14, 165, 233, 0.2), transparent 60%),
                        radial-gradient(circle at 90% 70%, rgba(249, 115, 22, 0.2), transparent 60%);
            mix-blend-mode: screen;
        }
    </style>
</head>
<body class="relative min-h-screen overflow-hidden bg-slate-950 text-slate-100">
    <div class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(circle_at_20%_20%,rgba(147,51,234,0.35),transparent_55%)]"></div>
    <div class="pointer-events-none absolute -left-24 top-16 -z-10 h-72 w-72 rounded-full bg-fuchsia-500/40 blur-3xl"></div>
    <div class="pointer-events-none absolute -right-16 bottom-10 -z-10 h-80 w-80 rounded-full bg-sky-500/30 blur-3xl"></div>

    <main class="mx-auto flex min-h-screen max-w-3xl items-center justify-center px-4 py-16">
        <form class="relative w-full overflow-hidden rounded-[28px] border border-white/10 bg-slate-900/70 p-10 shadow-[0_0_45px_-10px_rgba(244,114,182,0.6)] backdrop-blur-xl">
            <div class="pointer-events-none absolute inset-x-10 top-0 h-32 bg-gradient-to-b from-white/10 to-transparent blur-3xl"></div>
            <header class="relative space-y-4 text-center">
                <div class="inline-flex items-center justify-center gap-2 rounded-full border border-fuchsia-400/30 bg-fuchsia-500/10 px-4 py-1 text-xs font-semibold uppercase tracking-[0.45em] text-fuchsia-300">
                    <span>kareoQ</span>
                </div>
                <h1 class="text-4xl font-extrabold tracking-tight text-white drop-shadow-[0_0_35px_rgba(232,121,249,0.45)] sm:text-5xl">
                    Kareokizz
                </h1>
                <p class="mx-auto max-w-xl text-sm text-slate-300 sm:text-base">
                    Írd be a kedvenc karaoke számod címét, az eredeti előadót és nevezd meg az énekes(eke)t.
                    A rendező ez alapján pakolja fel a következő fellépést.
                </p>
            </header>

            <div class="relative mt-10 grid gap-6">
                <label class="grid gap-2 text-left text-sm font-medium text-slate-200">
                    <span class="uppercase tracking-[0.22em] text-xs text-slate-400">Dal címe</span>
                    <input id="song-title" name="song-title" type="text" required placeholder="Pl. Meseautó" class="neon-input" />
                </label>

                <label class="grid gap-2 text-left text-sm font-medium text-slate-200">
                    <span class="uppercase tracking-[0.22em] text-xs text-slate-400">Előadó / szerző</span>
                    <input id="song-author" name="song-author" type="text" required placeholder="Pl. Neoton Família" class="neon-input" />
                </label>

                <label class="grid gap-2 text-left text-sm font-medium text-slate-200">
                    <span class="uppercase tracking-[0.22em] text-xs text-slate-400">Énekes(ek) neve</span>
                    <input type="text" id="singers" name="singers" required placeholder="Sorold fel, ki lép színpadra" class="neon-input"></input>
                </label>

                <label class="grid gap-2 text-left text-sm font-medium text-slate-200">
                    <span class="uppercase tracking-[0.22em] text-xs text-slate-400">Megjegyzés <span class="text-slate-500">(nem kötelező)</span></span>
                    <input type="text" id="notes" name="notes" rows="3" placeholder="Pl: Hány mikrofon kell?" class="neon-input"></input>
                </label>
            </div>

            <button type="submit" class="mt-10 w-full rounded-2xl bg-gradient-to-r from-fuchsia-500 via-purple-500 to-sky-500 px-8 py-4 text-center text-sm font-semibold uppercase tracking-[0.4em] text-white shadow-[0_0_35px_rgba(129,140,248,0.55)] transition duration-300 hover:scale-[1.01] hover:shadow-[0_0_55px_rgba(232,121,249,0.75)] focus:outline-none focus:ring-4 focus:ring-fuchsia-400/50">
                Kérés elküldése
            </button>

            <p class="mt-6 text-center text-[0.7rem] uppercase tracking-[0.4em] text-slate-500">
                a mikrofon rád vár
            </p>
        </form>
    </main>

    <style>
        .neon-input {
            border-radius: 18px;
            border: 1px solid rgba(168, 85, 247, 0.35);
            background: rgba(15, 23, 42, 0.7);
            color: #f9fafb;
            padding: 0.95rem 1.1rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
            font-size: 0.95rem;
        }

        .neon-input:focus {
            outline: none;
            border-color: rgba(236, 72, 153, 0.8);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35);
            transform: translateY(-1px);
        }

        .neon-input::placeholder {
            color: rgba(226, 232, 240, 0.45);
            letter-spacing: 0.02em;
        }
    </style>
</body>
</html>
